name: FastAPI CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recruit_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: recruitment_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruit_user -d recruitment_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://recruit_user:test_password@localhost:5432/recruitment_test_db
          DATABASE_URL: postgresql+psycopg2://recruit_user:test_password@localhost:5432/recruitment_test_db
          JWT_SECRET_KEY: ci-test-secret-key
          JWT_ALGORITHM: HS256
          SMTP_EMAIL: test@example.com
          SMTP_PASSWORD: test-password
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q
